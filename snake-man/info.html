<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNAKE-MAN INFO</title>
    <!-- The Thor's lower screen (MainActivity.InfoScreen): everything but the game itself, laid out to
         fit the screen with nothing scrolling. It holds no game state: the game page sends show(json)
         a few times a second (dual.js payload), and a tap on a panel cell goes back up through
         SnakeManInfo.tap. -->
    <link rel="stylesheet" href="panels.css">
    <style>
        :root {
            --bg: #07090a; --card: rgba(12, 22, 12, 0.92); --edge: #1f4d1f; --edge-hi: #3a7a2a;
            --ink: #e8e2cf; --dim: #7d8a78; --gold: #ffd700; --good: #3f6; --warn: #ff5b5b; --cyan: #5ff;
            --font: 'Press Start 2P', 'Courier New', monospace;
        }
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { display: none; }
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--font); }
        body {
            display: grid; grid-template-rows: 9vh 1fr 6.5vh; gap: 1.6vh; padding: 2vh 2.4vw 0;
            background:
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.22) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at 50% 35%, #0f1a10 0%, var(--bg) 70%);
        }

        /* --- header: logo and the mode badge --- */
        header { display: flex; align-items: center; justify-content: space-between; gap: 2vw; min-width: 0; }
        .logo {
            font-size: 5vh; letter-spacing: 0.06em; white-space: nowrap;
            background: linear-gradient(180deg, #fff6a8 0%, #ffd700 45%, #ff8a1f 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0.45vh 0.45vh 0 #401010);
        }
        .badge {
            font-size: 2.2vh; padding: 1.3vh 2vh; border-radius: 1.4vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border: 0.35vh solid currentColor; box-shadow: 0 0 2vh -0.4vh currentColor, inset 0 0 1.4vh -0.6vh currentColor;
        }

        /* --- cards --- */
        main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 1.6vh 1.8vw; min-height: 0; }
        .col { display: flex; flex-direction: column; gap: 1.6vh; min-height: 0; }
        .card {
            background: var(--card); border: 0.35vh solid var(--edge); border-radius: 1.6vh; padding: 1.8vh 1.8vw;
            box-shadow: inset 0 0.4vh 0 rgba(255, 255, 255, 0.04), 0 0.6vh 0 rgba(0, 0, 0, 0.5); min-height: 0;
        }
        .card h2 { margin: 0 0 1.4vh; font-size: 1.5vh; font-weight: normal; color: var(--dim); letter-spacing: 0.2em; }
        .grow { flex: 1; display: flex; flex-direction: column; }
        .grow > .skills, .grow > .legend { flex: 1; align-content: space-evenly; }
        .mode.grow { display: grid; }
        .row { display: flex; align-items: center; gap: 1.2vw; flex-wrap: wrap; }
        .chip { font-size: 1.7vh; padding: 0.9vh 1.3vh; border-radius: 1vh; background: rgba(255, 255, 255, 0.06); border: 0.25vh solid rgba(255, 255, 255, 0.12); white-space: nowrap; }

        /* hero: the one thing to do now */
        .hero { text-align: center; border-color: var(--edge-hi); }
        .hero .big { font-size: 4vh; line-height: 1.3; margin: 0.6vh 0 1.6vh; }
        .hero .call { font-size: 2.3vh; display: flex; align-items: center; justify-content: center; gap: 1.2vw; margin-bottom: 1.8vh; }
        .pulse { animation: pulse 1.2s steps(2) infinite; }
        @keyframes pulse { 50% { opacity: 0.45; } }
        .hero .row { justify-content: center; }
        .hero .line { font-size: 1.7vh; margin-top: 1.1vh; line-height: 1.5; }

        /* mode */
        .mode { display: grid; grid-template-columns: 0.8vh 1fr; gap: 1.6vw; }
        .mode .stripe { border-radius: 0.4vh; }
        .mode .name { font-size: 2.4vh; margin-bottom: 1vh; }
        .mode .blurb { font-size: 1.6vh; color: var(--dim); line-height: 1.6; }

        /* player */
        .player .name { font-size: 2.6vh; color: var(--gold); }
        .lv { font-size: 1.7vh; padding: 0.8vh 1.1vh; border-radius: 0.8vh; background: var(--gold); color: #1a1200; }
        .xp { height: 1.4vh; background: #1a221a; border-radius: 0.7vh; overflow: hidden; margin: 1.6vh 0 1.2vh; border: 0.2vh solid #2a3a2a; }
        .xp i { display: block; height: 100%; background: linear-gradient(90deg, #2c8a2c, var(--good)); }
        .points { font-size: 1.6vh; }

        /* skills */
        .skills { display: grid; grid-template-columns: auto auto 1fr auto auto; gap: 1.25vh 1.2vw; align-items: center; font-size: 1.6vh; }
        .bar { height: 1.2vh; background: #1a221a; border-radius: 0.6vh; overflow: hidden; }
        .bar i { display: block; height: 100%; }
        .stat { color: #aaa; font-size: 1.45vh; white-space: nowrap; }

        /* buttons legend: each button drawn like the one on the controller */
        .legend { display: grid; grid-template-columns: auto 1fr; gap: 1.5vh 1.4vw; align-items: center; font-size: 1.8vh; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; justify-self: end;
            min-width: 5vh; height: 5vh; padding: 0 1.2vh; border-radius: 1.2vh; font-size: 1.8vh;
            background: #3a3f3a; color: #f1f1f1; box-shadow: inset 0 -0.5vh 0 rgba(0, 0, 0, 0.4), 0 0.3vh 0 #000;
            font-family: var(--font);
        }
        .btn.face { width: 5vh; padding: 0; border-radius: 50%; font-size: 2.1vh; }
        .btn.sys { height: 3.8vh; min-width: 7vh; font-size: 1.3vh; border-radius: 1.9vh; background: #262a26; color: #cfd; }
        .btn.ps { background: #1d2230; font-family: system-ui, sans-serif; font-size: 2.6vh; }

        /* in a run */
        .big3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 1.6vh 1.6vw; }
        .big3 .card { text-align: center; }
        .value { font-size: 4.6vh; color: var(--gold); margin-top: 0.6vh; }
        .value.low { color: var(--warn); animation: pulse 0.8s steps(2) infinite; }
        .hearts { font-size: 4vh; color: #ff3355; letter-spacing: 0.4vw; font-family: system-ui, sans-serif; margin-top: 0.2vh; }
        .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.6vh 1.6vw; }
        .fact .k { font-size: 1.4vh; color: var(--dim); margin-bottom: 1vh; }
        .fact .v { font-size: 2.1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .powers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4vh 1.4vw; }
        .grow > .powers { flex: 1; align-content: space-evenly; }
        .power span { white-space: nowrap; }
        .power b { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .power.wide { grid-column: 1 / -1; }
        .power { display: flex; justify-content: space-between; align-items: center; gap: 1vw; font-size: 2vh;
                 padding: 1.8vh 1.4vw; border-radius: 1.2vh; border: 0.3vh solid #2a3a2a; background: rgba(255, 255, 255, 0.03); }
        .power b { font-weight: normal; padding: 0.7vh 1vh; border-radius: 0.8vh; font-size: 1.6vh; white-space: nowrap; }
        .power.ready b { background: #154d15; color: var(--good); }
        .power.cool b { background: #222; color: #888; }
        .power.on { border-color: #b89cff; } .power.on b { background: #3a2a66; color: #e0d4ff; }

        /* an open panel (controls, scores, upgrades, name) takes the whole screen */
        #panel { display: none; }
        body.panel { grid-template-rows: 1fr 6.5vh; }
        body.panel header, body.panel main { display: none; }
        body.panel #panel { display: flex; }
        #panel.padmenu {
            position: static; inset: auto; min-height: 0; overflow: hidden; padding: 1.6vh 2vw; gap: 1.2vh;
            font-size: 1.55vh; border-radius: 1.6vh; border: 0.35vh solid var(--edge); background: rgba(6, 12, 6, 0.97);
        }
        #panel .pm-title { font-size: 2.8vh; }
        #panel .pm-dev, #panel .pm-note, #panel .pm-live, #panel .pm-hint { font-size: 1.35vh; }
        #panel .pm-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2.2vw; align-items: start; width: 100%; }
        #panel .pm-col { gap: 0.6vh; }
        #panel .pm-grid { width: 100%; gap: 0.55vh 0.8vw; }
        #panel .pm-act { font-size: 1.4vh; }
        #panel .pm-slot, #panel .pm-row { padding: 0.65vh 0.8vw; border-radius: 1vh; font-size: 1.45vh; border-width: 0.25vh; }
        #panel .pm-row, #panel .pm-sec-rows, #panel .sc-board { width: 100%; }
        #panel .pm-sec { font-size: 1.35vh; margin-top: 0.8vh; padding-bottom: 0.5vh; }
        #panel .pm-report { max-height: 16vh; overflow: hidden; font-size: 1.2vh; width: 100%; }

        footer { display: flex; align-items: flex-start; justify-content: center; font-size: 1.4vh; color: #556; padding-top: 1vh; }
    </style>
</head>
<body>
    <header><div class="logo">SNAKE-MAN</div><div class="badge" id="badge">-</div></header>
    <main><div class="col" id="left"></div><div class="col" id="right"></div></main>
    <div id="panel"></div>
    <footer id="dev">WAITING FOR THE GAME</footer>
    <script>
        'use strict';
        const $ = id => document.getElementById(id);
        const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const LEVEL_COLOR = { easy: '#6f6', normal: '#FFD700', hard: '#f55' };

        // A button drawn as the controller has it: round face buttons in their colours, shoulders and
        // START / SELECT as pills. raw is the plain name (A, L1, START...), glyph what is printed on it.
        const FACE = {
            xbox: { A: '#3db449', B: '#e0383e', X: '#2f7fe8', Y: '#f5c518' },
            ps: { A: '#8fb4ff', B: '#ff6b6b', X: '#ff8ad8', Y: '#4fdca5' },
        };
        function button(glyph, raw, family) {
            if (/^[ABXY]$/.test(raw)) {
                if (family === 'ps') return `<span class="btn face ps" style="color:${FACE.ps[raw]}">${esc(glyph)}</span>`;
                const c = (FACE.xbox)[raw];
                return family === 'xbox'
                    ? `<span class="btn face" style="background:${c};color:#0b0b0b">${esc(glyph)}</span>`
                    : `<span class="btn face" style="background:#d9d9d4;color:#111">${esc(glyph)}</span>`;
            }
            if (/^(START|SELECT|HOME)$/.test(raw)) return `<span class="btn sys">${esc(glyph)}</span>`;
            return `<span class="btn">${esc(glyph)}</span>`;
        }
        const legendCard = (d, title) =>
            `<div class="card grow"><h2>${title}</h2><div class="legend">`
            + (d.legend || []).map(([g, what, raw]) => button(g, raw, d.family) + `<span>${esc(what)}</span>`).join('')
            + '</div></div>';
        const press = (d, what) => {
            const r = (d.legend || []).find(l => l[1] === what);
            return r ? button(r[0], r[2], d.family) : '';
        };

        function skillsCard(d, title) {
            return `<div class="card grow"><h2>${title}</h2><div class="skills">`
                + (d.skills || []).map(s =>
                    `<span style="color:${esc(s.color)}">${esc(s.name)}</span><span>LV ${s.level}</span>`
                    + `<span class="bar"><i style="width:${Math.round(s.progress * 100)}%;background:${esc(s.color)}"></i></span>`
                    + `<span class="stat">${esc(s.stat)}</span><span style="color:var(--good)">${s.gain > 0 ? '+' + s.gain : ''}</span>`).join('')
                + '</div></div>';
        }

        function menuView(d) {
            const M = d.menu, L = [];
            if (M.screen === 'ready') {
                L.push(`<div class="card hero"><div class="call pulse">PRESS ${press(d, 'PLAY')} TO PLAY</div>
                    <div class="row"><span class="chip" style="color:${LEVEL_COLOR[M.level] || '#fff'}">LEVEL ${esc(M.level.toUpperCase())}</span>
                    <span class="chip">5:00 ON THE CLOCK</span><span class="chip">MAP #${esc(M.map)}</span></div></div>`);
            } else if (M.screen === 'paused') {
                L.push(`<div class="card hero"><div class="big" style="color:var(--good)">PAUSED</div>
                    <div class="call">PRESS ${press(d, 'PAUSE')} TO RESUME</div><div class="line" style="color:var(--dim)">SKILLS GROW WITH USE</div></div>`);
            } else if (M.over) {
                const O = M.over, line = l => l ? `<div class="line" style="color:${esc(l.color)}">${esc(l.text)}</div>` : '';
                L.push(`<div class="card hero"><div class="big" style="color:${O.reason === 'TIME UP' ? 'var(--gold)' : 'var(--warn)'}">${esc(O.reason)}</div>
                    <div class="row"><span class="chip" style="color:var(--gold);font-size:2.4vh">SCORE ${esc(O.score)}</span>
                    <span class="chip" style="color:#ff5577">RUNG ${esc(O.rung)} · ${esc(O.missions)} MISSIONS</span></div>
                    ${line(O.board)}${line(O.xp)}${line(O.record)}</div>`);
            }
            if (M.screen !== 'over') {
                L.push(`<div class="card mode"><div class="stripe" style="background:${esc(M.mode.color)}"></div>
                    <div><div class="name" style="color:${esc(M.mode.color)}">${esc(M.mode.title)}</div><div class="blurb">${esc(M.mode.blurb || '')}</div></div></div>`);
            }
            const P = M.player;
            L.push(`<div class="card player"><div class="row" style="justify-content:space-between"><span class="name">${esc(P.name)}</span><span class="lv">LV ${P.level}</span></div>
                <div class="xp"><i style="width:${Math.round(P.progress * 100)}%"></i></div>
                <div class="points" style="color:${P.points ? 'var(--good)' : 'var(--dim)'}">${P.points} POINT${P.points === 1 ? '' : 'S'} TO SPEND</div></div>`);
            L.push(skillsCard(d, M.screen === 'over' ? 'SKILLS THIS RUN' : 'SKILLS'));
            $('left').innerHTML = L.join('');
            $('right').innerHTML = legendCard(d, 'BUTTONS');
        }

        function playView(d) {
            const t = document.createElement('div');
            t.innerHTML = d.stats;   // the game's own stats panel, read by its ids
            const v = id => { const e = t.querySelector('#' + id); return e ? e.textContent.trim() : ''; };
            const time = v('time'), low = /^0:[0-2]\d$/.test(time);
            const lives = Math.max(0, parseInt(v('lives'), 10) || 0);
            const power = (name, val, onRe) => {
                const state = val === 'READY' ? 'ready' : onRe && onRe.test(val) ? 'on' : 'cool';
                return `<div class="power ${state}"><span>${name}</span><b>${esc(val || '-')}</b></div>`;
            };
            const lunge = (d.legend || []).some(r => r[1] === 'DASH'), zombies = (d.legend || []).some(r => r[1] === 'SHOOT');
            $('left').innerHTML =
                `<div class="big3">
                    <div class="card"><h2>SCORE</h2><div class="value">${esc(v('score'))}</div></div>
                    <div class="card"><h2>TIME</h2><div class="value${low ? ' low' : ''}">${esc(time)}</div></div>
                    <div class="card"><h2>LIVES</h2><div class="hearts">${'♥'.repeat(Math.min(lives, 6))}${lives > 6 ? '+' : ''}</div></div>
                </div>
                <div class="card"><div class="facts">
                    <div class="fact"><div class="k">${esc(v('hiTier') || 'HI')}</div><div class="v">${esc(v('hi'))}</div></div>
                    <div class="fact"><div class="k">ZONE</div><div class="v">${esc(v('zone'))}</div></div>
                    <div class="fact"><div class="k">LEVEL</div><div class="v">${esc(v('lv'))}</div></div>
                </div></div>
                <div class="card grow"><h2>POWERS</h2><div class="powers">
                    ${power('COAT', v('coat'), /\.\ds$/)}${power('DIG', v('dash'), /DIG!/)}
                    ${lunge ? power('DASH', v('lunge'), /DASH!/) : ''}
                    <div class="power wide"><span>SKILL</span><b style="color:var(--cyan)">${esc(v('skill'))}</b></div>
                    ${zombies ? `<div class="power wide"><span>GUN</span><b>${esc(v('gun'))}</b></div>` : ''}
                    <div class="power wide"><span>EVOLVED</span><b>${esc(v('evo'))}</b></div>
                </div></div>
                <div class="card mode"><div class="stripe" style="background:${esc(d.color)}"></div>
                    <div><div class="name" style="color:${esc(d.color)}">${esc(d.mode)}</div><div class="blurb">${esc(d.blurb || '')}</div></div></div>`;
            $('right').innerHTML = legendCard(d, 'BUTTONS');
        }

        // Called by MainActivity with the game page's SM.dual.payload().
        window.show = text => {
            const d = JSON.parse(text), panel = !!d.panel;
            document.body.classList.toggle('panel', panel);
            const badge = $('badge');
            badge.textContent = d.mode;
            badge.style.color = d.color || '#fff';
            $('dev').textContent = d.device ? d.device.toUpperCase() : 'NO CONTROLLER YET';
            if (panel) {
                const p = $('panel');
                p.className = d.panel.cls; p.removeAttribute('hidden'); p.innerHTML = d.panel.html;
                const sel = p.querySelector('.sel');   // keep the highlighted row in sight, as the game does
                if (sel) sel.scrollIntoView({ block: 'nearest' });
                return;
            }
            if (d.menu) menuView(d); else playView(d);
        };

        // Touch works down here: a tapped panel cell is clicked on the game page.
        document.addEventListener('click', e => {
            const cell = e.target.closest('[data-r]');
            if (!cell || !window.SnakeManInfo) return;
            SnakeManInfo.tap(JSON.stringify({ r: +cell.dataset.r, c: cell.dataset.c === undefined ? null : +cell.dataset.c }));
        });
    </script>
</body>
</html>
