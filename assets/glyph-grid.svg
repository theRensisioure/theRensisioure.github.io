<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="Glyph grid pattern">
  <defs>
    <pattern id="brush" patternUnits="userSpaceOnUse" width="720" height="4">
      <rect width="720" height="4" fill="#0a0a0c"/>
      <line x1="0" y1="2" x2="720" y2="2" stroke="#111116" stroke-width="0.5" opacity="0.6"/>
    </pattern>
    <g id="glyph-cross"><path d="M18 6h4v12h-4zm-8 8h12v-4H10z" fill="#e0e0d8"/></g>
    <g id="glyph-dots"><circle cx="10" cy="10" r="1.5" fill="#e0e0d8"/><circle cx="20" cy="10" r="1.5" fill="#e0e0d8"/><circle cx="10" cy="20" r="1.5" fill="#e0e0d8"/><circle cx="20" cy="20" r="1.5" fill="#e0e0d8"/></g>
    <g id="glyph-grid"><rect x="8" y="8" width="14" height="14" fill="none" stroke="#e0e0d8" stroke-width="1"/><line x1="8" y1="15" x2="22" y2="15" stroke="#e0e0d8"/><line x1="15" y1="8" x2="15" y2="22" stroke="#e0e0d8"/></g>
    <g id="glyph-x"><path d="M9 9l12 12M21 9L9 21" stroke="#e0e0d8" stroke-width="1.5" fill="none"/></g>
    <g id="glyph-chev"><path d="M10 18l10-8-10-8" fill="none" stroke="#e0e0d8" stroke-width="1.5"/></g>
  </defs>
  <rect width="720" height="480" fill="url(#brush)"/>
  <g opacity="0.95">
    <!-- 12 x 8 grid of glyph cells -->
    <g transform="translate(24,24)">
      <!-- row 0 -->
      <g transform="translate(0,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-cross" transform="translate(12,12)"/></g>
      <g transform="translate(58,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-dots" transform="translate(12,12)"/></g>
      <g transform="translate(116,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-grid" transform="translate(12,12)"/></g>
      <g transform="translate(174,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-x" transform="translate(12,12)"/></g>
      <g transform="translate(232,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-chev" transform="translate(12,12)"/></g>
      <g transform="translate(290,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-cross" transform="translate(12,12) rotate(45 15 15)"/></g>
      <g transform="translate(348,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-dots" transform="translate(12,12)"/></g>
      <g transform="translate(406,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-grid" transform="translate(12,12)"/></g>
      <g transform="translate(464,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-x" transform="translate(12,12)"/></g>
      <g transform="translate(522,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-chev" transform="translate(12,12) scale(-1,1) translate(-30,0)"/></g>
      <g transform="translate(580,0)"><rect width="54" height="54" fill="none" stroke="#2a2a32" stroke-width="0.5"/><use href="#glyph-cross" transform="translate(12,12)"/></g>
      <!-- simplified: repeat pattern rows via clone -->
    </g>
  </g>
  <text x="360" y="460" text-anchor="middle" fill="#6b6b62" font-family="monospace" font-size="11">glyph specimen · theRensisioure</text>
</svg>